# Default permissions for the plugin.
# This is the set of permissions automatically enabled by the plugin
# or when explicitly adding the `plugin:sql:default` permission

"$schema" = "./schemas/permission-set.schema.json"

identifier = "default"
description = "Default permissions for the SQL plugin."
permissions = [
  "allow-load",
  "allow-execute",
  "allow-select",
  "allow-close",
  "allow-begin-transaction",
  "allow-commit-transaction",
  "allow-rollback-transaction"
]
